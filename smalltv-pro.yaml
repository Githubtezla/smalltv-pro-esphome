# GeekMagic SmallTV Pro (ESP32, 8 MB flash, no PSRAM) with ESPHome instead of the stock firmware.
#
# The clock fetches a "draw list" (shapes and texts as JSON, a few KB) from your own server every
# 15 seconds and draws it itself (drawlist.h). The touch button on top reports single and double taps
# to the server. No cloud, no time server, no web UI on the clock: it only talks to your server.
#
# Pins of the SmallTV Pro: SPI CLK 18, MOSI 23, DC 2, reset 4, backlight 25 (PWM, inverted),
# touch GPIO32 (T9). Display ST7789V 240x240, colors inverted.

substitutions:
  name: smalltv-pro
  friendly_name: SmallTV Pro
  device_key: desk                          # the name your server uses for this clock
  server: http://192.168.1.10:8790          # base URL of your server (plain HTTP in the LAN)
  touch_threshold: "1650"                   # see "Touch calibration" in the README

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - drawlist.h
  on_boot:
    - priority: -100
      then:
        - component.update: screen          # show the placeholder right after boot

esp32:
  board: esp32dev
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - script.execute: fetch

mdns:
  disabled: true

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s                        # do not reboot when no Home Assistant / client is connected

ota:
  - platform: esphome
    password: !secret ota_password

http_request:
  timeout: 10s
  verify_ssl: false

globals:
  - id: last_body
    type: std::string
    initial_value: '""'

interval:
  - interval: 15s
    then:
      - script.execute: fetch

script:
  # Fetch the draw list; redraw only when it changed.
  - id: fetch
    mode: single
    then:
      - http_request.get:
          url: ${server}/api/devices/${device_key}/drawlist
          capture_response: true
          max_response_buffer_size: 8192
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200 && body != id(last_body);
                  then:
                    - lambda: |-
                        if (drawlist::parse(body)) {
                          id(last_body) = body;
                          int b = drawlist::brightness();
                          if (b >= 0) {
                            auto call = b > 0 ? id(backlight).turn_on() : id(backlight).turn_off();
                            if (b > 0)
                              call.set_brightness(b / 100.0f);
                            call.perform();
                          }
                        } else {
                          ESP_LOGW("drawlist", "cannot parse draw list (%u bytes)", (unsigned) body.size());
                        }
                    - component.update: screen
          on_error:
            then:
              - logger.log:
                  level: WARN
                  format: "server not reachable"

  - id: report_button
    mode: queued
    parameters:
      event: string
    then:
      - http_request.post:
          url: ${server}/api/devices/${device_key}/button
          request_headers:
            Content-Type: application/json
          body: !lambda 'return "{\"event\":\"" + event + "\"}";'
          on_response:
            then:
              - logger.log:
                  format: "button event sent, server answered %d"
                  args: ["response->status_code"]
              - delay: 500ms                # give the server time to update the page
              - script.execute: fetch
          on_error:
            then:
              - logger.log:
                  level: WARN
                  format: "button event not sent: server not reachable"

esp32_touch:
  # setup_mode: true writes the raw values to the log, see "Touch calibration" in the README.
  setup_mode: false
  iir_filter: 10ms
  low_voltage_reference: 0.7V
  high_voltage_reference: 2.5V

binary_sensor:
  - platform: esp32_touch
    id: touch
    name: Touch
    pin: GPIO32
    threshold: ${touch_threshold}
    filters:
      - delayed_on_off: 20ms
    # A single tap only counts when no second tap follows within 0.5 s,
    # so a double tap never triggers the single action as well.
    on_multi_click:
      - timing:
          - ON for 30ms to 1s
          - OFF for at most 500ms
          - ON for 30ms to 1s
          - OFF for at least 300ms
        then:
          - script.execute:
              id: report_button
              event: double
      - timing:
          - ON for 30ms to 1500ms
          - OFF for at least 500ms
        then:
          - script.execute:
              id: report_button
              event: single

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO25
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s

# Every font size costs flash; add or remove sizes here AND in the font_for list below.
# Characters outside "glyphs" are not drawn.
font:
  - file: "gfonts://Roboto"
    id: r14
    size: 14
    glyphs: &glyphs ' !"#%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz°²³·ÄÖÜßäöüÉéèàç€…'
  - file: "gfonts://Roboto"
    id: r18
    size: 18
    glyphs: *glyphs
  - file: "gfonts://Roboto@700"
    id: b16
    size: 16
    glyphs: *glyphs
  - file: "gfonts://Roboto@700"
    id: b20
    size: 20
    glyphs: *glyphs
  - file: "gfonts://Roboto@700"
    id: b28
    size: 28
    glyphs: *glyphs
  - file: "gfonts://Roboto@700"
    id: b56
    size: 56
    glyphs: '0123456789:-'

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  interface: hardware

display:
  - platform: mipi_spi
    id: screen
    model: ST7789V
    data_rate: 40MHz
    # Partial buffer (30 lines, 14 KB): the page is drawn in eight passes. Each pass must start with
    # filling the background, otherwise the driver stops drawing (keep "f" as the first op).
    buffer_size: 12.5%
    spi_mode: MODE3
    dc_pin: GPIO02
    reset_pin: GPIO04
    dimensions:
      width: 240
      height: 240
      offset_height: 0
      offset_width: 0
    invert_colors: true
    update_interval: never
    lambda: |-
      if (drawlist::ops().empty()) {
        // nothing from the server yet: dark screen with a frame
        it.fill(Color(16, 16, 20));
        it.rectangle(20, 20, 200, 200, Color(70, 190, 210));
        return;
      }
      auto font_for = [](const std::string &k) -> esphome::display::BaseFont * {
        if (k == "r14") return id(r14);
        if (k == "r18") return id(r18);
        if (k == "b16") return id(b16);
        if (k == "b20") return id(b20);
        if (k == "b28") return id(b28);
        if (k == "b56") return id(b56);
        return nullptr;
      };
      drawlist::draw(it, font_for);
